name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test
      - run: vp build
      - name: Verify production build artifacts
        run: |
          test -f dist/server/server.js
          test -f dist/client/index.html || test -d dist/client/assets
          if grep -R --include='*.js' -E '(sk-[A-Za-z0-9]{16,}|ZHIHU_ACCESS_SECRET=|OPENAI_API_KEY=)' dist; then
            echo 'Potential secret leaked into build output' >&2
            exit 1
          fi
