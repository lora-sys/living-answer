<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Living Answer — keep old answers honest as the world changes</title>
  <desc id="desc">A warm editorial hero illustration showing an old answer becoming evidence-backed today, with lora and Mochi beside the workflow.</desc>
  <defs>
    <pattern id="paper" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#f8f4ec"/>
      <circle cx="4" cy="6" r="0.8" fill="#dfd6c8" opacity="0.45"/>
      <circle cx="25" cy="21" r="0.65" fill="#dfd6c8" opacity="0.34"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5b4939" flood-opacity="0.12"/>
    </filter>
    <clipPath id="characterCrop">
      <rect x="0" y="0" width="455" height="520" rx="36"/>
    </clipPath>
    <linearGradient id="amberWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efbd62" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#d78d32" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="620" rx="32" fill="url(#paper)"/>
  <path d="M0 506C280 450 470 572 715 502c170-49 252-43 370 14 176 85 325-2 515-15v119H0Z" fill="#efe6d8" opacity="0.72"/>
  <circle cx="1350" cy="290" r="235" fill="url(#amberWash)" opacity="0.6"/>

  <g fill="#3d3027" font-family="Noto Sans CJK SC, Noto Sans, sans-serif">
    <text x="84" y="100" font-size="21" letter-spacing="4" fill="#a86d29" font-weight="700">EVIDENCE-BACKED MAINTENANCE</text>
    <text x="80" y="178" font-size="76" letter-spacing="-3" font-weight="800">Living Answer</text>
    <text x="84" y="224" font-size="25" fill="#6f5d4e">Keep old answers honest as the world changes.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="82" y="284" width="248" height="154" rx="20" fill="#fffdf9" stroke="#3d3027" stroke-width="3"/>
    <rect x="106" y="314" width="74" height="23" rx="11.5" fill="#ded6ca"/>
    <path d="M106 367h170M106 392h122" stroke="#b9aa9a" stroke-width="9" stroke-linecap="round"/>
    <text x="106" y="425" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="700" fill="#6f5d4e">OLD ANSWER</text>

    <rect x="382" y="284" width="248" height="154" rx="20" fill="#fffdf9" stroke="#3d3027" stroke-width="3"/>
    <circle cx="421" cy="326" r="14" fill="#d99a3c"/>
    <path d="m415 326 5 5 10-12" fill="none" stroke="#fffdf9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M453 325h131M420 367h164M420 392h112" stroke="#b9aa9a" stroke-width="9" stroke-linecap="round"/>
    <text x="420" y="425" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="700" fill="#6f5d4e">EVIDENCE</text>

    <rect x="682" y="284" width="248" height="154" rx="20" fill="#fffdf9" stroke="#3d3027" stroke-width="3"/>
    <path d="M725 328h158M725 358h111" stroke="#d99a3c" stroke-width="10" stroke-linecap="round"/>
    <path d="M725 389h164" stroke="#b9aa9a" stroke-width="9" stroke-linecap="round"/>
    <text x="725" y="425" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="700" fill="#6f5d4e">TODAY'S UPDATE</text>
  </g>

  <g fill="none" stroke="#d99a3c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M334 360h42"/>
    <path d="m362 346 16 14-16 14"/>
    <path d="M634 360h42"/>
    <path d="m662 346 16 14-16 14"/>
  </g>

  <g transform="translate(1075 56)" clip-path="url(#characterCrop)">
    <rect x="0" y="0" width="580" height="580" fill="#f3eadf"/>
    <image href="living-answer-lora-mochi-crop.png" x="100" y="0" width="255" height="520" preserveAspectRatio="none"/>
  </g>
  <rect x="1075" y="56" width="455" height="520" rx="36" fill="none" stroke="#3d3027" stroke-width="3" opacity="0.85"/>

  <g transform="translate(1110 524)">
    <rect width="296" height="52" rx="26" fill="#3d3027"/>
    <circle cx="29" cy="26" r="8" fill="#d99a3c"/>
    <text x="52" y="34" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="19" font-weight="700" fill="#fffdf9" letter-spacing="0.4">respect the original author</text>
  </g>
</svg>
